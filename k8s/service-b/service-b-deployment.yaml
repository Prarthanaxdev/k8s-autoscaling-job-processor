apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: service-b
        image: prarthanabahuguna/service-b-worker:latest
        ports:
        - containerPort: 9100
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "300m"
        envFrom:
        - configMapRef:
            name: service-b-config
