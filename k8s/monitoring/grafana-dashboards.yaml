apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-service-b
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  service-b-dashboard.json: |-
    {
      "uid": "service-b-worker",
      "title": "Service B - Worker Metrics",
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "tags": ["kubernetes", "service-b", "prometheus"],
      "panels": [
        {
          "type": "timeseries",
          "title": "Jobs processed / sec",
          "id": 1,
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(jobs_processed_total[5m]))",
              "legendFormat": "jobs/s"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Job errors / sec",
          "id": 2,
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(job_errors_total[5m]))",
              "legendFormat": "errors/s"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Processing time p95 (seconds)",
          "id": 3,
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(job_processing_time_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Processing time avg (seconds)",
          "id": 4,
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(job_processing_time_seconds_sum[5m])) / clamp_min(sum(rate(job_processing_time_seconds_count[5m])), 1)",
              "legendFormat": "avg"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Service B replicas (deployment)",
          "id": 5,
          "gridPos": {"x": 0, "y": 16, "w": 24, "h": 7},
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"default\", deployment=\"service-b\"}",
              "legendFormat": "available"
            },
            {
              "refId": "B",
              "expr": "kube_deployment_status_replicas{namespace=\"default\", deployment=\"service-b\"}",
              "legendFormat": "desired"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-service-c
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  service-c-dashboard.json: |-
    {
      "uid": "service-c-stats",
      "title": "Service C - Stats Metrics",
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "tags": ["kubernetes", "service-c", "prometheus"],
      "panels": [
        {
          "type": "stat",
          "title": "Queue length",
          "id": 11,
          "gridPos": {"x": 0, "y": 0, "w": 8, "h": 6},
          "targets": [
            {
              "refId": "A",
              "expr": "queue_length"
            }
          ],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
        },
        {
          "type": "timeseries",
          "title": "Resident memory (bytes)",
          "id": 12,
          "gridPos": {"x": 8, "y": 0, "w": 16, "h": 6},
          "targets": [
            {
              "refId": "A",
              "expr": "process_resident_memory_bytes"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Event loop lag (seconds)",
          "id": 13,
          "gridPos": {"x": 0, "y": 6, "w": 12, "h": 7},
          "targets": [
            {
              "refId": "A",
              "expr": "nodejs_eventloop_lag_seconds"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU usage (process_cpu_seconds_total rate)",
          "id": 14,
          "gridPos": {"x": 12, "y": 6, "w": 12, "h": 7},
          "targets": [
            {
              "refId": "A",
              "expr": "rate(process_cpu_seconds_total[5m])"
            }
          ]
        }
      ]
    }
